            const tObj = aiCreativeThemes[studioState.theme];
            const label = document.getElementById('ai-theme-desc');
            if (!label) return;
            label.innerText = studioState.aiNote || (tObj ? `AI · ${tObj.name}` : 'AI 排版与风格');
        }

        function openThemeSheet() {
            const m = document.getElementById('theme-sheet');
            m.classList.remove('hidden');
            m.classList.add('flex');
            lucide.createIcons();
        }

        function closeThemeSheet() {
            const m = document.getElementById('theme-sheet');
            m.classList.add('hidden');
            m.classList.remove('flex');
        }

        function extractPhrase(text) {
            const t = (text || '').split(/[，。！？,.!?；;、\s]/).filter(Boolean)[0] || '';
            return t.slice(0, 11);
        }

        function applyCustomPromptDirection(promptText) {
            const clean = (promptText || '').trim();
            if (!clean) {
                showToast("请输入你想要的排版感觉");
                return;
            }
            closeThemeSheet();
            runAILoadingSequence(() => {
                const list = getSelectedFragmentsList();
                const loc = list[0]?.location || '城市街角';
                const base = extractPhrase(list[0]?.text) || loc;

                if (clean.includes('暗') || clean.includes('胶片') || clean.includes('夜') || clean.includes('电影')) {
                    studioState.theme = 'amber_film';
                    studioState.customBgStyle = 'background: linear-gradient(155deg, #1E1C20 0%, #2D262E 100%); color: #F5EFEB;';
                    (studioState.storyBlocks || []).forEach(b => b.textStyle = 'caption-in');
                } else if (clean.includes('图上') || clean.includes('悬浮') || clean.includes('胶带')) {
                    studioState.theme = 'scrapbook';
                    studioState.customBgStyle = '';
                    (studioState.storyBlocks || []).forEach(b => b.textStyle = 'tape-float');
                } else {
                    studioState.theme = 'illustrated';
                    studioState.customBgStyle = 'background: linear-gradient(160deg, #F6F4EC 0%, #E7E3D4 100%); color: #262420;';
                    (studioState.storyBlocks || []).forEach((b, i) => b.textStyle = i % 2 === 0 ? 'side-by-side' : 'tape-float');
                }

                studioState.customTitle = `${base} · 拾帧记`;
                studioState.aiNote = `定制 · ${clean.slice(0, 6)}`;
                renderStudioCanvas();
                showToast(`已按「${clean.slice(0, 10)}」重排`);
            }, [
                [`正在理解「${clean.slice(0, 10)}」…`, 45],
                ['正在生成对应图文版式…', 88]
            ]);
        }

        function simulateReferenceUpload() {
            closeThemeSheet();
            runAILoadingSequence(() => {
                studioState.customBgStyle = 'background: linear-gradient(160deg, #F6EFE8 0%, #E5D6C5 100%); color: #362B22;';
                studioState.aiNote = '参考图风格 · 复古杂志';
                (studioState.storyBlocks || []).forEach((blk, i) => {
                    blk.textStyle = i % 2 === 0 ? 'side-by-side' : 'tape-float';
                });
                renderStudioCanvas();
                showToast('已提取参考图色彩与排版节奏');
            }, [
                ['正在提取参考图色板与留白比例…', 50],
                ['正在映射当前碎片图文…', 90]
            ]);
        }

        function openFragmentManagerSheet() {
            document.getElementById('fragment-manager-sheet').classList.remove('hidden');
            renderFragmentManagerList();
            lucide.createIcons();
        }

        function closeFragmentManagerSheet() {
            document.getElementById('fragment-manager-sheet').classList.add('hidden');
        }

        function renderFragmentManagerList() {
            const q = (document.getElementById('sheet-frag-search')?.value || '').trim().toLowerCase();
            const listEl = document.getElementById('sheet-frag-list');

            const filtered = fragments.filter(f => {
                if (q && !f.text.toLowerCase().includes(q) && !f.location.toLowerCase().includes(q)) return false;
                return true;
            });

            filtered.sort((a, b) => (selectedIds.has(b.id) ? 1 : 0) - (selectedIds.has(a.id) ? 1 : 0));

            listEl.innerHTML = filtered.map(f => {
                const isSel = selectedIds.has(f.id);
                const thumb = (f.images && f.images[0]) || null;
                return `
                <div onclick="toggleFragmentInsideStudio('${f.id}')" class="cursor-pointer bg-white p-2 rounded-xl border ${isSel ? 'border-apple-accent' : 'border-black/[0.04]'} flex items-center gap-2.5">
                    ${thumb ? `<img src="${thumb}" class="w-9 h-9 rounded-lg object-cover shrink-0">`
                           : `<span class="w-9 h-9 rounded-lg bg-apple-tag text-apple-sub text-[9px] flex items-center justify-center shrink-0">文</span>`}
                    <div class="flex-1 min-w-0">
                        <p class="font-serif text-[11px] text-apple-text truncate">${f.text}</p>
                        <p class="text-[9px] text-apple-sub truncate mt-0.5">${f.dateGroup} · ${f.location}</p>
                    </div>
                    <span class="text-[9px] shrink-0 ${isSel ? 'text-apple-accent font-semibold' : 'text-apple-sub'}">${isSel ? '已加入' : '加入'}</span>
                </div>`;
            }).join('');
        }

        function toggleFragmentInsideStudio(id) {
            if (selectedIds.has(id) && selectedIds.size <= 1) {
                showToast("至少保留 1 项碎片");
                return;
            }
            if (selectedIds.has(id)) selectedIds.delete(id);
            else selectedIds.add(id);
            syncStudioPhotosFromFragments();
            renderFragmentManagerList();
            renderStudioCanvas();
        }

        function openAlbumPicker() {
            renderAlbumPickerList();
            const m = document.getElementById('album-picker-sheet');
            m.classList.remove('hidden');
            m.classList.add('flex');
        }

        function closeAlbumPicker() {
            const m = document.getElementById('album-picker-sheet');
            m.classList.add('hidden');
            m.classList.remove('flex');
        }

        function renderAlbumPickerList() {
            const el = document.getElementById('album-picker-list');
            if (!el) return;
            el.innerHTML = albumBooks.map(b => {
                const active = editingPageRef && editingPageRef.albumId === b.id;
                return `
                <button onclick="confirmAppendToAlbum('${b.id}')" class="w-full flex items-center space-x-3 p-2 rounded-2xl bg-white border ${active ? 'border-apple-accent' : 'border-black/[0.04]'} active:scale-[0.99] transition-transform">
                    <img src="${b.cover}" class="w-9 h-12 rounded-lg object-cover shrink-0">
                    <div class="flex-1 text-left min-w-0">
                        <p class="font-serif text-[12px] font-semibold text-apple-text truncate">《${b.title}》</p>
                        <p class="text-[9px] text-apple-sub mt-0.5 truncate">${b.pages.length} 页 · ${b.subtitle}</p>
                    </div>
                    ${active ? '<span class="text-[9px] text-apple-accent shrink-0">正在编辑</span>' : '<i data-lucide="chevron-right" class="w-3.5 h-3.5 text-apple-sub/50 shrink-0"></i>'}
                </button>`;
            }).join('');
            lucide.createIcons();
        }

        function confirmAppendToAlbum(albumId) {
            closeAlbumPicker();
            appendPosterPageToAlbum(albumId);
        }

        function appendPosterPageToAlbum(albumId) {
            const list = getSelectedFragmentsList();
            const targetAlbumId = albumId || pendingAlbumTargetId || (editingPageRef ? editingPageRef.albumId : albumBooks[0].id);
            pendingAlbumTargetId = null;
            const album = albumBooks.find(a => a.id === targetAlbumId);
            const titleText = studioState.customTitle || `在${list[0]?.location || '街角'}被治愈的日常切片`;
            const bodyText = (studioState.storyBlocks || []).filter(b => b.showText).map(b => b.text).join(' ');
            const coverImg = studioState.storyBlocks?.find(b => b.photos?.length)?.photos?.[0]?.url || samplePhotoPool[0];

            const newPageObj = {
                id: editingPageRef ? editingPageRef.pageId : ('page_' + Date.now()),
                dateStr: '2026.11.04',
                title: titleText,
                bodyText: bodyText,
                theme: studioState.theme,
                format: studioState.format,
                customBgStyle: studioState.customBgStyle,
                fragmentIds: list.map(f => f.id),
                storyBlocks: JSON.parse(JSON.stringify(studioState.storyBlocks || []))
            };

            let targetPageIndex = 0;
            if (album) {
                if (editingPageRef && editingPageRef.albumId === album.id) {
                    const idx = album.pages.findIndex(p => p.id === editingPageRef.pageId);
                    if (idx >= 0) {
                        album.pages[idx] = newPageObj;
                        targetPageIndex = idx;
                    } else {
                        album.pages.unshift(newPageObj);
                    }
                } else {
                    album.pages.unshift(newPageObj);
                }
                album.cover = coverImg;
                list.forEach(f => {
                    f.albumId = album.id;
                    f.pageId = newPageObj.id;
                });
            }

            selectedIds.clear();
            studioState.customTitle = '';
            studioState.customBgStyle = '';
            closeStudioModal();
            switchMainTab('albums');
            if (album) openAlbumReader(album.id, targetPageIndex);
            showToast(`已装订进《${album ? album.title : '日常周记'}》`);
        }

        // ==================== 6.5 真实分享链路 ====================
        let currentShareData = { title: '', body: '', loc: '' };

        function openShareSheetFromStudio() {
            const list = getSelectedFragmentsList();
            const thumb = studioState.storyBlocks?.find(b => b.photos?.length)?.photos?.[0]?.url || list[0]?.images?.[0] || samplePhotoPool[0];
            const title = studioState.customTitle || `在${list[0]?.location || '街角'}被治愈的日常切片`;
            const desc = (studioState.storyBlocks || []).filter(b => b.showText).map(b => b.text).join(' ');
            const loc = list.map(f => f.location).filter(Boolean).join(' · ');
            openShareSheetCommon(thumb, title, desc, loc);
        }

        function openShareSheetFromReader() {
            if (!readingAlbum) return;
            const page = readingAlbum.pages[readingPageIndex];
            const f = fragments.find(fr => page.fragmentIds.includes(fr.id));
            const thumb = page.storyBlocks?.[0]?.photos?.[0]?.url || f?.images?.[0] || readingAlbum.cover;
            openShareSheetCommon(thumb, page.title, page.bodyText || f?.text || '', f?.location || '日常记录');
        }

        function openShareSheetCommon(thumb, title, desc, loc) {
            currentShareData = { title, body: desc, loc: loc || '生活切片' };
            document.getElementById('share-preview-thumb').src = thumb;
            document.getElementById('share-preview-title').innerText = title;
            switchShareCopyStyle('xhs');
            const modal = document.getElementById('share-sheet-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            lucide.createIcons();
        }

        function switchShareCopyStyle(style) {
            const xhsBtn = document.getElementById('copy-tab-xhs');
            const momBtn = document.getElementById('copy-tab-moments');
            const box = document.getElementById('share-copywriting-box');
            const body = (currentShareData.body || '').replace(/\s+/g, ' ').trim();
            if (style === 'xhs') {
                xhsBtn.className = "flex-1 py-1.5 rounded-full bg-white text-apple-text shadow-sm";
                momBtn.className = "flex-1 py-1.5 rounded-full";
                box.value = `${currentShareData.title}\n\n${body}\n\n📍 ${currentShareData.loc}\n#日常碎片 #生活美学 #Plog`;
            } else {
                momBtn.className = "flex-1 py-1.5 rounded-full bg-white text-apple-text shadow-sm";
                xhsBtn.className = "flex-1 py-1.5 rounded-full";
                box.value = `${currentShareData.title}。${body.slice(0, 42)}`;
            }
        }

        function saveRenderedImageToPhone() {
            const btn = document.getElementById('btn-save-img');
            if (!btn) return;
            btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i><span>已存相册</span>`;
            btn.className = "flex-1 py-2.5 rounded-2xl bg-emerald-600 text-white text-[11px] font-semibold flex items-center justify-center space-x-1";
            lucide.createIcons();
            showToast("高清画报已保存至系统相册");
        }

        function copyTextToClipboardFallback(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
        }

        function copyAndRemindPlatform() {
            const text = document.getElementById('share-copywriting-box').value;
            copyTextToClipboardFallback(text);
            saveRenderedImageToPhone();
            setTimeout(() => {
                closeShareSheet();
                showToast("图片已存相册 & 文案已复制，可前往小红书/微信直接粘贴发布");
            }, 600);
        }

        function closeShareSheet() {
            const modal = document.getElementById('share-sheet-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // ==================== 7. 多图上传与速记 ====================
        function togglePhotoPickerDrawer() {
            const drawer = document.getElementById('multi-photo-drawer');
            drawer.classList.toggle('hidden');
            if (!drawer.classList.contains('hidden')) renderPhotoPickerGrid();
        }

        function renderPhotoPickerGrid() {
            const grid = document.getElementById('photo-picker-grid');
            grid.innerHTML = samplePhotoPool.map(url => {
                const idx = pendingUploadImages.indexOf(url);
                const selected = idx >= 0;
                return `
                    <div onclick="togglePendingImage('${url}')" class="relative aspect-square rounded-xl overflow-hidden cursor-pointer border-2 ${selected ? 'border-apple-accent' : 'border-transparent'}">
                        <img src="${url}" class="w-full h-full object-cover">
                        <span class="absolute top-1 right-1 w-4 h-4 rounded-full text-[9px] font-bold flex items-center justify-center ${selected ? 'bg-apple-accent text-white' : 'bg-black/40 text-white/70'}">
                            ${selected ? idx + 1 : '+'}
                        </span>
                    </div>`;
            }).join('');
        }

        function togglePendingImage(url) {
            const idx = pendingUploadImages.indexOf(url);
            if (idx >= 0) pendingUploadImages.splice(idx, 1);
            else pendingUploadImages.push(url);
            renderPhotoPickerGrid();
            updateComposerAttachmentsBar();
        }

        function updateComposerAttachmentsBar() {
            const bar = document.getElementById('composer-attachments');
            const badge = document.getElementById('composer-img-badge');
            if (pendingUploadImages.length > 0) {
                badge.innerText = pendingUploadImages.length;
                badge.classList.remove('hidden');
                bar.classList.remove('hidden');
                bar.innerHTML = `
                    <div class="flex items-center space-x-1.5 overflow-x-auto no-scrollbar py-0.5">
                        ${pendingUploadImages.map(u => `<img src="${u}" class="w-7 h-7 rounded-lg object-cover border border-black/10">`).join('')}
                        <span class="text-apple-sub text-[10px] pl-1">已选 ${pendingUploadImages.length} 张</span>
                    </div>
                    <button onclick="clearPendingAttachments()" class="text-apple-sub text-[10px] shrink-0 ml-2">清空</button>`;
            } else {
                badge.classList.add('hidden');
                bar.classList.add('hidden');
            }
        }

        function clearPendingAttachments() {
            pendingUploadImages = [];
            updateComposerAttachmentsBar();
            renderPhotoPickerGrid();
        }

        function simulateVoiceInput() {
            const input = document.getElementById('composer-input');
            input.value = '路过街角面包房买到了热乎的可颂，傍晚的风吹在脸上刚刚好。';
            showToast("语音已转写为文字");
        }

        function addNewFragment() {
            const input = document.getElementById('composer-input');
            const text = input.value.trim();
            if (!text && pendingUploadImages.length === 0) {
                showToast("写句话或选张照片吧");
                return;
            }
            const autoLoc = autoContextPresets[currentContextPresetIdx]?.location || '安福路街角';
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            fragments.unshift({
                id: 'f_' + Date.now(),
                year: 2026,
                monthKey: 11,
                dayNum: 4,
                dateGroup: '今天 · 11月4日',
                isToday: true,
                time: `${hh}:${mm}`,
                fuzzyPeriod: '',
                sortMinutes: 1439,
                location: autoLoc,
                mapX: 52,
                mapY: 48,
                range: 'week',
                type: pendingUploadImages.length > 1 ? 'multi-photo' : 'photo-note',
                images: pendingUploadImages.length > 0 ? [...pendingUploadImages] : [],
                text: text || '随手定格的日常瞬间。',
                albumId: null,
                pageId: null
            });
            input.value = '';
            pendingUploadImages = [];
            document.getElementById('multi-photo-drawer').classList.add('hidden');
            updateComposerAttachmentsBar();
            renderTimeline();
            showToast("已记入今日碎片");
        }

        // ==================== 8. 导航切换 ====================
        let currentTimeScale = 'day';

        function toggleQuickDateJump() {
            if (currentMainTab !== 'fragments') return;
            const pop = document.getElementById('quick-date-popover');
            pop.classList.toggle('hidden');
            if (!pop.classList.contains('hidden')) {
                renderPopoverCalendar();
            }
        }

        function jumpToToday() {
            filterDateMode = 'all';
            filterDayNum = null;
            pickerYear = 2026;
            pickerMonth = 11;
            updateHeaderDateLabel();
            document.getElementById('quick-date-popover').classList.add('hidden');
            switchTimeScale('day');
            renderTimeline();
            document.getElementById('main-scroll-area').scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleMainScroll(el) {
            const pill = document.getElementById('back-to-today-pill');
            if (el.scrollTop > 160 && currentMainTab === 'fragments' && currentTimeScale === 'day') {
                pill.classList.remove('hidden');
            } else {
                pill.classList.add('hidden');
            }

            if (currentMainTab === 'fragments' && currentTimeScale === 'day' && filterDateMode === 'all') {
                const secs = el.querySelectorAll('.timeline-date-sec');
                const containerTop = el.getBoundingClientRect().top;
                for (let i = 0; i < secs.length; i++) {
                    const rect = secs[i].getBoundingClientRect();
                    if (rect.bottom > containerTop + 40) {
                        const y = parseInt(secs[i].getAttribute('data-year'));
                        const m = parseInt(secs[i].getAttribute('data-month'));
                        updateHeaderDateLabel(y, m);
                        break;
                    }
                }
            }
        }

        function switchTimeScale(scale) {
            currentTimeScale = scale;
            document.getElementById('quick-date-popover').classList.add('hidden');
            ['day', 'gallery', 'map'].forEach(s => {
                const viewEl = document.getElementById(`scale-view-${s}`);
                const btnEl = document.getElementById(`scale-${s}`);
                if (viewEl) viewEl.classList.add('hidden');
                if (btnEl) btnEl.className = "flex-1 py-1 rounded-[9px] text-apple-sub transition-all";
            });
            document.getElementById(`scale-view-${scale}`).classList.remove('hidden');
            document.getElementById(`scale-${scale}`).className = "flex-1 py-1 rounded-[9px] bg-white text-apple-text shadow-sm transition-all";

            document.getElementById('btn-uncurated').classList.toggle('hidden', scale !== 'day');
            if (scale !== 'day') document.getElementById('back-to-today-pill').classList.add('hidden');

            if (scale === 'gallery') renderVisualGalleryGrid();
            if (scale === 'map') renderMapPins();
        }

        function switchMainTab(tab) {
            currentMainTab = tab;
            const isFrag = (tab === 'fragments');
            document.getElementById('quick-date-popover').classList.add('hidden');
            document.getElementById('tab-view-fragments').classList.toggle('hidden', !isFrag);
            document.getElementById('tab-view-albums').classList.toggle('hidden', isFrag);
            document.getElementById('sub-nav-fragments').classList.toggle('hidden', !isFrag);
            document.getElementById('quick-input-bar').classList.toggle('hidden', !isFrag || selectedIds.size > 0);

            if (isFrag) {
                updateHeaderDateLabel();
                document.getElementById('header-year-sub').classList.remove('hidden');
            } else {
                document.getElementById('header-date-title').innerText = '记忆画册书架';
                document.getElementById('header-year-sub').classList.add('hidden');
                document.getElementById('header-filter-pill').classList.add('hidden');
            }
            document.getElementById('header-right-actions').classList.toggle('hidden', !isFrag);
            if (!isFrag) {
                document.getElementById('back-to-today-pill').classList.add('hidden');
                document.getElementById('search-bar-wrap').classList.add('hidden');
            }

            document.getElementById('main-tab-fragments').className = isFrag
                ? "flex flex-col items-center space-y-0.5 text-apple-text"
                : "flex flex-col items-center space-y-0.5 text-apple-sub";
            document.getElementById('main-tab-albums').className = !isFrag
                ? "flex flex-col items-center space-y-0.5 text-apple-text relative"
                : "flex flex-col items-center space-y-0.5 text-apple-sub relative";

            if (!isFrag) {
                renderBookshelf();
                switchClusterCategory('people');
            }
            lucide.createIcons();
        }

        function toggleUncuratedFilter() {
            onlyUncurated = !onlyUncurated;
            const btn = document.getElementById('btn-uncurated');
            btn.className = onlyUncurated
                ? "px-2.5 py-1 rounded-full bg-apple-accent text-white text-[11px] font-semibold transition-all"
                : "px-2.5 py-1 rounded-full bg-apple-tag text-apple-sub text-[11px] font-medium transition-all";
            renderTimeline();
        }

        function toggleSearchBar() {
            const wrap = document.getElementById('search-bar-wrap');
            wrap.classList.toggle('hidden');
            if (!wrap.classList.contains('hidden')) document.getElementById('semantic-search-input').focus();
        }

        function handleSearch(val) {
            currentSearchQuery = val.trim();
            renderTimeline();
        }

        function clearSearch() {
            currentSearchQuery = '';
            document.getElementById('semantic-search-input').value = '';
            document.getElementById('search-bar-wrap').classList.add('hidden');
            renderTimeline();
        }

        function showToast(msg) {
            const t = document.getElementById('toast-msg');
            t.innerText = msg;
            const studioOpen = !document.getElementById('studio-modal').classList.contains('hidden');
            t.classList.toggle('top-[104px]', studioOpen);
            t.classList.toggle('top-14', !studioOpen);
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2200);
        }

        window.onload = function () {
            renderTimeline();
            renderBookshelf();
            switchClusterCategory('people');
            lucide.createIcons();
        };
    </script>
</body>
</html>
